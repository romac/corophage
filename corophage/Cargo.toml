[package]
name = "corophage"
version = "0.6.0-pre"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
authors = ["Romain Ruetschi <github@romac.me>"]
description = "Algebraic effects for stable Rust"
homepage = "https://github.com/romac/corophage"
repository = "https://github.com/romac/corophage"
keywords = ["effects", "algebraic-effects", "coroutines", "handlers"]
categories = ["rust-patterns"]
readme = "README.md"

[dependencies]
fauxgen = { version = "0.1", default-features = false }
frunk_core = { version = "0.5", default-features = false }
pin-project-lite = "0.2"
corophage-macros = { version = "0.6.0-pre", path = "../corophage-macros", optional = true }

[features]
default = ["macros"]
macros = ["dep:corophage-macros"]

[dev-dependencies]
divan = "0.1"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
trybuild = "1"

# This manual API example also tests its generic callback without macros.
[[example]]
name = "higher_order"
test = true

# These examples use the procedural macros to declare effects and programs.
[[example]]
name = "asynk"
required-features = ["macros"]

[[example]]
name = "choreography"
required-features = ["macros"]

[[example]]
name = "compose"
required-features = ["macros"]

[[example]]
name = "debug_snapshot"
required-features = ["macros"]

[[example]]
name = "debugger"
required-features = ["macros"]

[[example]]
name = "saga"
required-features = ["macros"]

[[example]]
name = "sync"
required-features = ["macros"]

[[bench]]
name = "effects"
harness = false
required-features = ["macros"]

[[bench]]
name = "stress"
harness = false
required-features = ["macros"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
